services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    volumes:
      - signatures:/srv/storage
    ports: ["8000:8000"]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      ORIGIN: http://localhost:3000
      API_URL: http://api:8000 # hooks.server.ts meneruskan /api ke sini
    ports: ["3000:3000"]
    depends_on: [api]

  # Belum dipakai kode boilerplate; siap untuk persistensi dan antrean (PRD 10.1).
  db:
    image: postgres:16
    profiles: ["infra"]
    environment:
      POSTGRES_USER: timesheet
      POSTGRES_PASSWORD: timesheet
      POSTGRES_DB: timesheet
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["${POSTGRES_PORT:-5432}:5432"]

  redis:
    image: redis:7
    profiles: ["infra"]
    ports: ["${REDIS_PORT:-6379}:6379"]

volumes:
  signatures:
  pgdata:
