[project]
name = "jira-client"
version = "0.1.0"
description = "Klien Jira Cloud (REST v3) read-only untuk timesheet"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "timesheet-core", "tzdata; sys_platform == 'win32'"]

[tool.uv.sources]
timesheet-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_client"]
