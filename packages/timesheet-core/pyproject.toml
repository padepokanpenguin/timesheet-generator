[project]
name = "timesheet-core"
version = "0.1.0"
description = "Logika inti timesheet: skema, persentase, builder draf, renderer Excel"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "openpyxl>=3.1", "Pillow>=10.3", "holidays>=0.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timesheet_core"]
