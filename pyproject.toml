# Root workspace Python (uv). Anggota: 1 aplikasi + 2 library.
[project]
name = "timesheet-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/timesheet-core", "packages/jira-client"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = "--import-mode=importlib -q"
pythonpath = ["apps/api"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["apps/web", "packages/api-client"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends() di default argumen adalah pola FastAPI
